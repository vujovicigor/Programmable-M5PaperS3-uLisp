[platformio]
default_envs = m5papers3

[env:m5papers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_flags =
    -DM5PAPERS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    https://github.com/takkaO/OpenFontRender.git#a9acf5498ed058a034acaa1becbad790627b9ec1
monitor_speed = 115200
upload_port = /dev/cu.usbmodem141301
monitor_port = /dev/cu.usbmodem141301
upload_speed = 115200

; Firmware update over WiFi (the board must be idle at the uLisp prompt):
;   pio run -e ota -t upload
[env:ota]
extends = env:m5papers3
upload_protocol = espota
upload_port = ulisp.local
upload_flags = --port=3232
